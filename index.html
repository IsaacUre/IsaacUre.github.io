<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#16161c">
    <title>Isaac Ure · be right back</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ────────────────────────────────────────────────────────────
           BE RIGHT BACK — the holding page
           The URE BOY's LCD, lifted out of the shell and set on the
           same dark stage as /ureboy/ and /room/. It powers on, the
           eye opens, the line prints, and then it waits. No JS: the
           whole thing is CSS, so there is nothing to break.
           The blink is three hand-drawn frames on the eye's own grid
           (see the SVG), not the console's sliding lids.
           ──────────────────────────────────────────────────────────── */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #1A1A18;
            --paper: #FAFAF8;
            --red: #D81E05;          /* Tornado Red */

            /* the LCD, same palette as the console */
            --screen-bg: #e6e4d2;
            --screen-ink: #1c1d17;
            --screen-dim: #5a5b50;
            --screen-accent: #b5180a;
            --screen-hi: #ffffff;
            --screen-frame: #0e0e0b;

            --shell-edge: #444440;

            --font-pixel: 'Press Start 2P', monospace;
            --font-term: 'VT323', monospace;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font-pixel);
            color: var(--paper);
            background:
                radial-gradient(120% 90% at 50% -10%, #2a2a33 0%, #16161c 55%, #0c0c10 100%);
            min-height: 100vh;
            min-height: 100dvh;
            padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
            display: flex;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── the screen module ──
           auto margins centre it and, unlike align-items, still let a short
           landscape phone scroll to the top of it instead of clipping it. */
        .screen-frame {
            margin: auto;
            width: 100%;
            max-width: 400px;          /* fallback; the min() below is the real rule */
            /* on a short viewport (a phone on its side), size the frame to the height there is */
            width: min(100%, 400px, calc((100vh - 7rem) / .9));
            width: min(100%, 400px, calc((100dvh - 7rem) / .9));
            background: linear-gradient(160deg, #25251f, #161611);
            border: 1px solid var(--shell-edge);
            border-radius: 12px 12px 26px 12px;
            padding: 1.1rem;
            box-shadow:
                inset 0 2px 8px rgba(0,0,0,.7),
                inset 0 1px 0 rgba(255,255,255,.05),
                0 28px 60px rgba(0,0,0,.55);
        }

        .screen {
            position: relative;
            aspect-ratio: 10 / 9;
            background: var(--screen-bg);
            border: 3px solid var(--screen-frame);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), inset 0 0 26px rgba(0,0,0,.22);
            color: var(--screen-ink);
        }
        .screen-glow {
            position: absolute; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.16), transparent 60%);
        }
        .scanlines {
            position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: .35;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
        }
        /* power-on surge: a white pop, a dark dip, then the LCD is just on */
        .screen-flash {
            position: absolute; inset: 0; z-index: 7; pointer-events: none;
            opacity: 0; background: #fff;
            animation: screenSurge .34s ease .1s both;
        }
        @keyframes screenSurge {
            0%   { opacity: 0;   background: #fff; }
            14%  { opacity: .85; background: #fff; }
            40%  { opacity: .9;  background: #06060a; }
            72%  { opacity: .45; background: #06060a; }
            100% { opacity: 0;   background: #06060a; }
        }

        /* ── what is on the screen ── */
        .holding {
            position: absolute; inset: 0;
            padding: .85rem .9rem;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: .95rem;
            text-align: center;
        }

        /* the eye: the console's pixel mark. 48 units, 2 units to a cell, so a multiple of
           24px keeps every cell a whole number of pixels (96 = 4px cells, 72 = 3px) */
        .eye { width: 96px; height: 96px; color: var(--screen-ink); }
        .eye svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
        /* power-on: a bright line that stretches into the picture, the way a tube warms up */
        .eye svg { animation: bootOpen .5s ease .35s both; }
        @keyframes bootOpen {
            0%   { transform: scaleY(.05); opacity: 0; }
            40%  { opacity: 1; }
            100% { transform: scaleY(1); opacity: 1; }
        }
        .eye-glint { fill: var(--screen-hi); }
        /* once it is on, a quick look left, right, and back to you */
        .eye-pupil { animation: glance .7s steps(1, end) .95s; }
        @keyframes glance {
            0%        { transform: translateX(-4px); }
            43%       { transform: translateX(4px); }
            79%, 100% { transform: translateX(0); }
        }
        /* the blink: three frames (see the SVG), shown one at a time with steps(). the shut
           frame holds longest and the eye opens a little slower than it closed, like a real
           one. once as the line finishes printing, then twice an 8s cycle at uneven spacing,
           so it does not tick like a clock. */
        .lid-skin { fill: var(--screen-bg); }
        .lid-edge { fill: currentColor; }
        .bf { opacity: 0; }
        .bf-half { animation: bootHalf .3s steps(1, end) 1.85s, idleHalf 8s steps(1, end) 3.4s infinite; }
        .bf-slit { animation: bootSlit .3s steps(1, end) 1.85s, idleSlit 8s steps(1, end) 3.4s infinite; }
        .bf-shut { animation: bootShut .3s steps(1, end) 1.85s, idleShut 8s steps(1, end) 3.4s infinite; }
        /* one blink, 300ms: half 45 · slit 40 · shut 90 · slit 55 · half 70 */
        @keyframes bootHalf { 0% { opacity: 1; } 15% { opacity: 0; } 76.667% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bootSlit { 0% { opacity: 0; } 15% { opacity: 1; } 28.333% { opacity: 0; } 58.333% { opacity: 1; } 76.667% { opacity: 0; } 100% { opacity: 0; } }
        @keyframes bootShut { 0% { opacity: 0; } 28.333% { opacity: 1; } 58.333% { opacity: 0; } 100% { opacity: 0; } }
        /* the same blink at 3.28s and 7.04s of every 8s */
        @keyframes idleHalf {
            0% { opacity: 0; }
            41% { opacity: 1; } 41.5625% { opacity: 0; } 43.875% { opacity: 1; } 44.75% { opacity: 0; }
            88% { opacity: 1; } 88.5625% { opacity: 0; } 90.875% { opacity: 1; } 91.75% { opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes idleSlit {
            0% { opacity: 0; }
            41.5625% { opacity: 1; } 42.0625% { opacity: 0; } 43.1875% { opacity: 1; } 43.875% { opacity: 0; }
            88.5625% { opacity: 1; } 89.0625% { opacity: 0; } 90.1875% { opacity: 1; } 90.875% { opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes idleShut {
            0% { opacity: 0; }
            42.0625% { opacity: 1; } 43.1875% { opacity: 0; }
            89.0625% { opacity: 1; } 90.1875% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* the line. it types, one glyph a step: the font is strictly monospace, and at
           16px (the bitmap is 8px) each glyph is exactly 16 whole pixels wide, so the
           reveal edge never cuts through a pixel */
        .holding-word {
            font-family: var(--font-pixel);
            font-weight: normal;
            font-size: 1rem;
            line-height: 1.5;
            letter-spacing: 0;
            text-transform: uppercase;
            color: var(--screen-ink);
            white-space: nowrap;
        }
        .holding-word b { font-weight: normal; color: var(--screen-accent); }
        .holding-word span {
            display: inline-block;
            -webkit-clip-path: inset(0 100% 0 0);
            clip-path: inset(0 100% 0 0);
            animation: typeOut .78s steps(13, end) 1.3s forwards;
        }
        @keyframes typeOut {
            to { -webkit-clip-path: inset(0 0 0 0); clip-path: inset(0 0 0 0); }
        }

        /* the shell prompt, waiting. same cursor the console boots with */
        .term-row {
            display: flex; align-items: baseline; gap: .3rem;
            font-family: var(--font-term);
            font-size: 1.2rem; line-height: 1.1;
            margin-top: -.25rem;
            opacity: 0;
            animation: appear .1s steps(1, end) 2.25s forwards;
        }
        @keyframes appear { to { opacity: 1; } }
        .term-ps { color: var(--screen-accent); }
        .term-block {
            display: inline-block; width: .55em; height: .95em; margin-top: .1em;
            background: var(--screen-ink); vertical-align: text-bottom;
            animation: termBlink 1.06s steps(1) infinite;
        }
        @keyframes termBlink { 50% { opacity: 0; } }

        /* ── small screens ── */
        @media (max-width: 380px) {
            .screen-frame { padding: .9rem .85rem; }
            .holding { gap: .8rem; padding: .6rem .68rem; }
            .eye { width: 72px; height: 72px; }
            .term-row { font-size: 1.1rem; }
        }

        /* ── reduced motion: everything lands in its final state, nothing moves ── */
        @media (prefers-reduced-motion: reduce) {
            .screen-flash, .eye svg, .eye-pupil, .bf,
            .holding-word span, .term-row, .term-block { animation: none !important; }
            .holding-word span { -webkit-clip-path: none; clip-path: none; }
            .term-row { opacity: 1; }
            .scanlines { display: none; }
        }
    </style>
</head>
<body>
    <main class="screen-frame">
        <div class="screen">
            <div class="screen-glow"></div>
            <div class="scanlines" aria-hidden="true"></div>
            <div class="screen-flash" aria-hidden="true"></div>

            <div class="holding">
                <div class="eye" aria-hidden="true">
                    <svg viewBox="0 0 48 48" shape-rendering="crispEdges">
                        <g class="eye-ink" fill="currentColor"><rect x="22" y="12" width="14" height="2"/><rect x="16" y="14" width="24" height="2"/><rect x="14" y="16" width="28" height="2"/><rect x="8" y="18" width="24" height="2"/><rect x="38" y="18" width="6" height="2"/><rect x="42" y="20" width="4" height="2"/><rect x="44" y="22" width="2" height="2"/><rect x="4" y="24" width="4" height="2"/><rect x="46" y="24" width="2" height="2"/><rect x="2" y="26" width="2" height="2"/><rect x="0" y="28" width="2" height="2"/><rect x="38" y="28" width="10" height="2"/><rect x="6" y="30" width="12" height="2"/><rect x="32" y="30" width="8" height="2"/><rect x="14" y="32" width="22" height="2"/><rect x="20" y="34" width="10" height="2"/></g>
                        <g class="eye-pupil" fill="currentColor"><rect x="8" y="20" width="8" height="2"/><rect x="18" y="20" width="14" height="2"/><rect x="6" y="22" width="8" height="2"/><rect x="18" y="22" width="8" height="2"/><rect x="30" y="22" width="6" height="2"/><rect x="18" y="24" width="14" height="2"/><rect x="20" y="26" width="12" height="2"/><rect x="20" y="28" width="10" height="2"/><g class="eye-glint"><rect x="16" y="20" width="2" height="2"/><rect x="14" y="22" width="4" height="2"/></g></g>
                        <!-- the blink: three frames drawn on the same 24-cell grid. each frame paints LCD-coloured
                             skin over whatever the lids have moved past (the open lid's own ink, the pupil, the lower
                             lid when it lifts) and inks the lid edges where they are now. columns 0 and 23 are the
                             corners and no frame touches them, so the eye shuts along its own corner-to-corner line.
                             half: the upper lid, still arched, part-way down, the iris showing under it.
                             slit: the lids almost meet; a sliver of iris in the gap; the lower lid has lifted a row.
                             shut: the upper lid resting on the lifted lower lid, two cells thick, corner to corner. -->
                        <g class="bf bf-half"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="10" height="2"/><rect x="38" y="20" width="8" height="2"/><rect x="2" y="22" width="6" height="2"/><rect x="44" y="22" width="2" height="2"/><rect x="2" y="24" width="6" height="2"/></g><g class="lid-edge"><rect x="12" y="20" width="26" height="2"/><rect x="8" y="22" width="36" height="2"/><rect x="8" y="24" width="4" height="2"/><rect x="38" y="24" width="8" height="2"/><rect x="2" y="26" width="6" height="2"/></g></g>
                        <g class="bf bf-slit"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="44" height="2"/><rect x="2" y="22" width="44" height="2"/><rect x="2" y="24" width="6" height="2"/><rect x="18" y="24" width="14" height="2"/><rect x="2" y="30" width="16" height="2"/><rect x="32" y="30" width="14" height="2"/><rect x="2" y="32" width="44" height="2"/><rect x="2" y="34" width="44" height="2"/></g><g class="lid-edge"><rect x="8" y="24" width="10" height="2"/><rect x="32" y="24" width="14" height="2"/><rect x="2" y="26" width="6" height="2"/><rect x="18" y="26" width="14" height="2"/><rect x="2" y="28" width="16" height="2"/><rect x="32" y="28" width="14" height="2"/><rect x="18" y="30" width="14" height="2"/></g></g>
                        <g class="bf bf-shut"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="44" height="2"/><rect x="2" y="22" width="44" height="2"/><rect x="2" y="24" width="44" height="2"/><rect x="18" y="26" width="14" height="2"/><rect x="2" y="30" width="16" height="2"/><rect x="32" y="30" width="14" height="2"/><rect x="2" y="32" width="44" height="2"/><rect x="2" y="34" width="44" height="2"/></g><g class="lid-edge"><rect x="2" y="26" width="16" height="2"/><rect x="32" y="26" width="14" height="2"/><rect x="2" y="28" width="44" height="2"/><rect x="18" y="30" width="14" height="2"/></g></g>
                    </svg>
                </div>

                <h1 class="holding-word"><span>Be right <b>back</b></span></h1>

                <div class="term-row" aria-hidden="true"><span class="term-ps">&gt;</span><span class="term-block"></span></div>
            </div>
        </div>
    </main>
</body>
</html>
