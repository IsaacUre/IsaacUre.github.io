<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Isaac Ure</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #FAFAF8;
            --text: #1A1A18;
        }

        html, body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .holding {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.6rem;
            opacity: 0;
            animation: fadeIn 1.1s ease 0.15s forwards;
        }

        .holding-logo svg {
            width: 3.5rem;
            height: 3.5rem;
            display: block;
            opacity: 0.85;
        }

        .holding-text {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 500;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            letter-spacing: 0.01em;
            line-height: 1.2;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .holding { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
    <main class="holding">
        <span class="holding-logo" aria-hidden="true">
            <svg viewBox="0 0 48 48">
                <path d="M9 10 C13 13 31 17 39 24 C31 31 13 35 9 38" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M16 14 Q11 24 16 34 Q21 24 16 14Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <path d="M16 17 Q13 24 16 31 Q19 24 16 17Z" fill="currentColor" opacity="0.3"/>
            </svg>
        </span>
        <p class="holding-text">Be right back.</p>
    </main>
</body>
</html>
