<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="description" content="Isaac Ure. Coming soon; the eye's already on.">
    <meta name="theme-color" content="#000000">
    <title>Isaac Ure · coming soon</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3">
    <script>document.documentElement.className = 'js';</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* ────────────────────────────────────────────────────────────
           COMING SOON — the holding page
           Black. A terminal boots in the top-left corner, small, the
           way a machine does: the checks print and their results land
           as they finish, the banner, then the LCD's pixel eye, drawn in
           characters, wakes up as a flipbook of frames stamped one under
           the last, scrolling up and out like output does. Then it hands off to the URE BOY's
           LCD, lifted out of the shell, which powers on, prints the
           line, and waits. The terminal is a JS layer over a page that
           works without it: no JS, or reduced motion, and you get the
           screen straight away.
           The blink is the console's: three hand-drawn frames on the
           eye's own grid (see the SVG), the same frames and timings the
           URE BOY's eye uses.
           ──────────────────────────────────────────────────────────── */

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #1A1A18;
            --paper: #FAFAF8;
            --red: #D81E05;          /* Tornado Red */

            /* the LCD, same palette as the console */
            --screen-bg: #e6e4d2;
            --screen-ink: #1c1d17;
            --screen-dim: #5a5b50;
            --screen-accent: #b5180a;
            --screen-hi: #ffffff;
            --screen-frame: #0e0e0b;

            /* the terminal: the LCD's cream as phosphor, the shell's grey for dim,
               and the lighter red the site uses on dark (AA) */
            --term-fg: #e6e4d2;
            --term-dim: #8a8a82;
            --term-warn: #ff5436;

            --font-pixel: 'Press Start 2P', monospace;
            --font-term: 'VT323', monospace;
        }

        html, body { height: 100%; }

        body {
            font-family: var(--font-pixel);
            color: var(--paper);
            background: #000;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
            display: flex;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── the boot terminal (JS only; the frame sits under it, unlit, until it hands off) ── */
        /* top-left, small, and it scrolls: once the log outgrows the viewport the
           oldest lines leave through the top, as they do */
        .term {
            position: fixed; inset: 0; z-index: 10;
            overflow: hidden;
            background: #000;
            padding: calc(.5rem + env(safe-area-inset-top, 0px)) .6rem calc(3rem + env(safe-area-inset-bottom, 0px)) calc(.6rem + env(safe-area-inset-left, 0px));
            font-family: var(--font-term);
            font-size: 1rem;
            line-height: 1.15;
            color: var(--term-fg);
            text-shadow: 0 0 6px rgba(230, 228, 210, .22);
            cursor: default;
            user-select: none;
            -webkit-user-select: none;
        }
        .term[hidden] { display: none; }
        .tl { white-space: pre-wrap; word-break: break-word; min-height: 1.15em; }
        /* the banner (52 columns) and the eye (48) must not wrap: past a phone they
           take the terminal's size, and under it they take what the width allows.
           --col is the width of a column in ems, measured off whatever face is really
           rendering (VT323's is .4; the fallback monospace is wider), and the last
           clause keeps a 13-row eye frame inside a very short viewport */
        .tl-art {
            white-space: pre; word-break: normal; line-height: 1; letter-spacing: 0;
            font-size: min(1rem, calc((100vw - 1.2rem) / (52 * var(--col, .4))), calc((100vh - 5rem) / 10.4));
        }
        .tl-px { line-height: .8; padding-bottom: .8em; }   /* the pixel eye: two columns to a cell, .8 of a row
                                                               to a cell, and a cell row under each frame */
        .tl-dim { color: var(--term-dim); }
        .tl-warn { color: var(--term-warn); }
        .tc {
            display: inline-block; width: .55em; height: .95em; margin-top: .1em;
            background: var(--term-fg); vertical-align: text-bottom;
            animation: termBlink 1.06s steps(1) infinite;
        }
        .term-skip {
            position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); z-index: 11;
            font-family: var(--font-term); font-size: 1.1rem; line-height: 1;
            color: var(--term-dim); background: #000;
            border: 1px solid #45453f; border-radius: 4px;
            padding: .3rem .65rem .35rem;
            cursor: pointer;
            opacity: 0; visibility: hidden;       /* not in the tab order until it can be seen */
            animation: appear .1s steps(1, start) 1.2s forwards;
            -webkit-tap-highlight-color: transparent;
        }
        .term-skip[hidden] { display: none; }
        .term-skip:hover { color: var(--term-fg); border-color: var(--term-dim); }
        .term-skip:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

        /* until the terminal hands off, the frame is there for assistive tech but not
           for eyes, and its choreography is held at frame zero */
        .js .screen-frame:not(.lit) { opacity: 0; pointer-events: none; }
        .js .screen-frame:not(.lit) * { animation-play-state: paused !important; }
        .screen-frame:focus { outline: none; }    /* it takes focus from the skip button, quietly */

        /* ── the screen: the LCD alone, square, set straight into the black ──
           auto margins centre it and, unlike align-items, still let a short
           landscape phone scroll to the top of it instead of clipping it. */
        .screen-frame {
            margin: auto;
            width: 100%;
            max-width: 364px;          /* fallback; the max()/min() below is the real rule */
            /* on a short viewport (a phone on its side, a laptop at 200% zoom) size the screen
               to the height there is: 3rem covers the body padding. never narrower than 208px,
               which is the 176px line plus the padding around it, so the line is never cut;
               past that the page scrolls. */
            width: max(208px, min(100%, 364px, calc((100vh - 3rem) / .9)));
            width: max(208px, min(100%, 364px, calc((100dvh - 3rem) / .9)));
        }

        .screen {
            position: relative;
            aspect-ratio: 10 / 9;
            background: var(--screen-bg);
            overflow: hidden;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), inset 0 0 26px rgba(0,0,0,.22);
            color: var(--screen-ink);
        }
        .screen-glow {
            position: absolute; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.16), transparent 60%);
        }
        .scanlines {
            position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: .35;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
        }
        /* power-on surge: a white pop, a dark dip, then the LCD is just on */
        .screen-flash {
            position: absolute; inset: 0; z-index: 7; pointer-events: none;
            opacity: 0; background: #fff;
            animation: screenSurge .34s ease .1s both;
        }
        @keyframes screenSurge {
            0%   { opacity: 0;   background: #fff; }
            14%  { opacity: .85; background: #fff; }
            40%  { opacity: .9;  background: #06060a; }
            72%  { opacity: .45; background: #06060a; }
            100% { opacity: 0;   background: #06060a; }
        }

        /* ── what is on the screen ── */
        .holding {
            position: absolute; inset: 0;
            padding: .85rem .9rem;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: .95rem;
            text-align: center;
        }

        /* the eye: the console's pixel mark. 48 units, 2 units to a cell, so a multiple of
           24px keeps every cell a whole number of pixels (96 = 4px cells, 72 = 3px) */
        .eye { width: 96px; height: 96px; color: var(--screen-ink); }
        .eye svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }
        /* power-on: a bright line that stretches into the picture, the way a tube warms up */
        .eye svg { animation: bootOpen .5s ease .35s both; }
        @keyframes bootOpen {
            0%   { transform: scaleY(.05); opacity: 0; }
            40%  { opacity: 1; }
            100% { transform: scaleY(1); opacity: 1; }
        }
        .eye-glint { fill: var(--screen-hi); }
        /* once it is on, a quick look left, right, and back to you */
        .eye-pupil { animation: glance .7s steps(1, end) .95s; }
        @keyframes glance {
            0%        { transform: translateX(-4px); }
            43%       { transform: translateX(4px); }
            79%, 100% { transform: translateX(0); }
        }
        /* the blink: three frames (see the SVG), shown one at a time with steps(). the shut
           frame holds longest and the eye opens a little slower than it closed, like a real
           one. once as the line finishes printing, then twice an 8s cycle at uneven spacing,
           so it does not tick like a clock. */
        .lid-skin { fill: var(--screen-bg); }
        .lid-edge { fill: currentColor; }
        .bf { opacity: 0; }
        .bf-half { animation: bootHalf .3s steps(1, end) 1.4s, idleHalf 8s steps(1, end) 3.4s infinite; }
        .bf-slit { animation: bootSlit .3s steps(1, end) 1.4s, idleSlit 8s steps(1, end) 3.4s infinite; }
        .bf-shut { animation: bootShut .3s steps(1, end) 1.4s, idleShut 8s steps(1, end) 3.4s infinite; }
        /* one blink, 300ms: half 45 · slit 40 · shut 90 · slit 55 · half 70 */
        @keyframes bootHalf { 0% { opacity: 1; } 15% { opacity: 0; } 76.667% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes bootSlit { 0% { opacity: 0; } 15% { opacity: 1; } 28.333% { opacity: 0; } 58.333% { opacity: 1; } 76.667% { opacity: 0; } 100% { opacity: 0; } }
        @keyframes bootShut { 0% { opacity: 0; } 28.333% { opacity: 1; } 58.333% { opacity: 0; } 100% { opacity: 0; } }
        /* the same blink at 3.28s and 7.04s of every 8s */
        @keyframes idleHalf {
            0% { opacity: 0; }
            41% { opacity: 1; } 41.5625% { opacity: 0; } 43.875% { opacity: 1; } 44.75% { opacity: 0; }
            88% { opacity: 1; } 88.5625% { opacity: 0; } 90.875% { opacity: 1; } 91.75% { opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes idleSlit {
            0% { opacity: 0; }
            41.5625% { opacity: 1; } 42.0625% { opacity: 0; } 43.1875% { opacity: 1; } 43.875% { opacity: 0; }
            88.5625% { opacity: 1; } 89.0625% { opacity: 0; } 90.1875% { opacity: 1; } 90.875% { opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes idleShut {
            0% { opacity: 0; }
            42.0625% { opacity: 1; } 43.1875% { opacity: 0; }
            89.0625% { opacity: 1; } 90.1875% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* the line. it types, one glyph a step (the first on the beat, the rest 45ms
           apart): the font is strictly monospace, and at 16px (the bitmap is 8px) each
           glyph is exactly 16 whole pixels wide, so the reveal edge never cuts through a
           pixel */
        .holding-word {
            font-family: var(--font-pixel);
            font-weight: normal;
            font-size: 1rem;
            line-height: 1.5;
            letter-spacing: 0;
            text-transform: uppercase;
            color: var(--screen-ink);
            white-space: nowrap;
        }
        .holding-word b { font-weight: normal; color: var(--screen-accent); }
        .holding-word span {
            display: inline-block;
            width: 11ch;               /* exactly 11 cells: the inner text box rounds up by 1/64px
                                          because of the <b>, and 11 steps of that would drift
                                          a hair into the next glyph */
            -webkit-clip-path: inset(0 100% 0 0);
            clip-path: inset(0 100% 0 0);
            animation: typeOut .5s steps(11, start) 1s forwards;
        }
        @keyframes typeOut {
            to { -webkit-clip-path: inset(0 0 0 0); clip-path: inset(0 0 0 0); }
        }

        /* the shell prompt, waiting. same cursor the console boots with */
        .term-row {
            display: flex; align-items: baseline; gap: .3rem;
            font-family: var(--font-term);
            font-size: 1.2rem; line-height: 1.1;
            margin-top: -.25rem;
            opacity: 0;
            animation: appear .1s steps(1, start) 1.8s forwards;
        }
        /* steps(n, start), not end, wherever a stepped animation fills forwards: the
           browser's progress at the end is (end - delay) / duration in floating point,
           which can land a hair under 1, and an end step then floors to the frame before
           the last and holds it. a start step rounds up and lands on the last. */
        @keyframes appear { to { opacity: 1; visibility: visible; } }
        .term-ps { color: var(--screen-accent); }
        .term-block {
            display: inline-block; width: .55em; height: .95em; margin-top: .1em;
            background: var(--screen-ink); vertical-align: text-bottom;
            animation: termBlink 1.06s steps(1) infinite;
        }
        @keyframes termBlink { 50% { opacity: 0; } }

        /* ── small screens ── */
        @media (max-width: 380px) {
            .holding { gap: .8rem; padding: .6rem .68rem; }
            .eye { width: 72px; height: 72px; }
            .term-row { font-size: 1.1rem; }
        }

        /* ── forced colours (Windows High Contrast): the screen goes Canvas, so the lid skin
             has to follow it or a blink paints a beige almond; and the cursor blocks are
             backgrounds, which forced colours would erase ── */
        @media (forced-colors: active) {
            .lid-skin { fill: Canvas; }
            .eye-glint { fill: Canvas; }          /* SVG fills are not forced: keep the glint off the pupil */
            .term-block, .tc { forced-color-adjust: none; background: CanvasText; }
        }

        /* ── reduced motion: no boot, everything lands in its final state, nothing moves ── */
        @media (prefers-reduced-motion: reduce) {
            .term, .term-skip { display: none !important; }
            .js .screen-frame:not(.lit) { opacity: 1; pointer-events: auto; }
            .screen-flash, .eye svg, .eye-pupil, .bf,
            .holding-word span, .term-row, .term-block, .term-skip { animation: none !important; }
            .holding-word span { -webkit-clip-path: none; clip-path: none; }
            .term-row { opacity: 1; }
            .scanlines { display: none; }
        }
    </style>
</head>
<body>
    <!-- the boot terminal. decoration for the ear: the page's content is the screen below -->
    <div class="term" id="term" hidden aria-hidden="true">
        <div id="termLog"></div>
    </div>
    <button class="term-skip" id="termSkip" type="button" hidden aria-label="skip the boot">skip ▸</button>

    <main class="screen-frame" id="frame">
        <div class="screen">
            <div class="screen-glow"></div>
            <div class="scanlines" aria-hidden="true"></div>
            <div class="screen-flash" aria-hidden="true"></div>

            <div class="holding">
                <div class="eye" aria-hidden="true">
                    <svg viewBox="0 0 48 48" shape-rendering="crispEdges">
                        <g class="eye-ink" fill="currentColor"><rect x="22" y="12" width="14" height="2"/><rect x="16" y="14" width="24" height="2"/><rect x="14" y="16" width="28" height="2"/><rect x="8" y="18" width="24" height="2"/><rect x="38" y="18" width="6" height="2"/><rect x="42" y="20" width="4" height="2"/><rect x="44" y="22" width="2" height="2"/><rect x="4" y="24" width="4" height="2"/><rect x="46" y="24" width="2" height="2"/><rect x="2" y="26" width="2" height="2"/><rect x="0" y="28" width="2" height="2"/><rect x="38" y="28" width="10" height="2"/><rect x="6" y="30" width="12" height="2"/><rect x="32" y="30" width="8" height="2"/><rect x="14" y="32" width="22" height="2"/><rect x="20" y="34" width="10" height="2"/></g>
                        <g class="eye-pupil" fill="currentColor"><rect x="8" y="20" width="8" height="2"/><rect x="18" y="20" width="14" height="2"/><rect x="6" y="22" width="8" height="2"/><rect x="18" y="22" width="8" height="2"/><rect x="30" y="22" width="6" height="2"/><rect x="18" y="24" width="14" height="2"/><rect x="20" y="26" width="12" height="2"/><rect x="20" y="28" width="10" height="2"/><g class="eye-glint"><rect x="16" y="20" width="2" height="2"/><rect x="14" y="22" width="4" height="2"/></g></g>
                        <!-- the blink: three frames drawn on the same 24-cell grid. each frame paints LCD-coloured
                             skin over whatever the lids have moved past (the open lid's own ink, the pupil, the lower
                             lid when it lifts) and inks the lid edges where they are now. columns 0 and 23 are the
                             corners and no frame touches them, so the eye shuts along its own corner-to-corner line.
                             half: the upper lid, still arched, part-way down, the iris showing under it.
                             slit: the lids almost meet; a sliver of iris in the gap; the lower lid has lifted a row.
                             shut: the upper lid resting on the lifted lower lid, two cells thick, corner to corner. -->
                        <g class="bf bf-half"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="10" height="2"/><rect x="38" y="20" width="8" height="2"/><rect x="2" y="22" width="6" height="2"/><rect x="44" y="22" width="2" height="2"/><rect x="2" y="24" width="6" height="2"/></g><g class="lid-edge"><rect x="12" y="20" width="26" height="2"/><rect x="8" y="22" width="36" height="2"/><rect x="8" y="24" width="4" height="2"/><rect x="38" y="24" width="8" height="2"/><rect x="2" y="26" width="6" height="2"/></g></g>
                        <g class="bf bf-slit"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="44" height="2"/><rect x="2" y="22" width="44" height="2"/><rect x="2" y="24" width="6" height="2"/><rect x="18" y="24" width="14" height="2"/><rect x="2" y="30" width="16" height="2"/><rect x="32" y="30" width="14" height="2"/><rect x="2" y="32" width="44" height="2"/><rect x="2" y="34" width="44" height="2"/></g><g class="lid-edge"><rect x="8" y="24" width="10" height="2"/><rect x="32" y="24" width="14" height="2"/><rect x="2" y="26" width="6" height="2"/><rect x="18" y="26" width="14" height="2"/><rect x="2" y="28" width="16" height="2"/><rect x="32" y="28" width="14" height="2"/><rect x="18" y="30" width="14" height="2"/></g></g>
                        <g class="bf bf-shut"><g class="lid-skin"><rect x="2" y="10" width="44" height="2"/><rect x="2" y="12" width="44" height="2"/><rect x="2" y="14" width="44" height="2"/><rect x="2" y="16" width="44" height="2"/><rect x="2" y="18" width="44" height="2"/><rect x="2" y="20" width="44" height="2"/><rect x="2" y="22" width="44" height="2"/><rect x="2" y="24" width="44" height="2"/><rect x="18" y="26" width="14" height="2"/><rect x="2" y="30" width="16" height="2"/><rect x="32" y="30" width="14" height="2"/><rect x="2" y="32" width="44" height="2"/><rect x="2" y="34" width="44" height="2"/></g><g class="lid-edge"><rect x="2" y="26" width="16" height="2"/><rect x="32" y="26" width="14" height="2"/><rect x="2" y="28" width="44" height="2"/><rect x="18" y="30" width="14" height="2"/></g></g>
                    </svg>
                </div>

                <h1 class="holding-word"><span>Coming <b>soon</b></span></h1>

                <div class="term-row" aria-hidden="true"><span class="term-ps">&gt;</span><span class="term-block"></span></div>
            </div>
        </div>
    </main>

    <script>
    /* the boot. the console's terminal, cut down: print lines, land results, stamp the eye
       frame after frame, hand off. nothing types: a machine prints. anything that goes
       wrong lights the screen; so does any key, a tap, or 12 seconds. */
    (function () {
        var frame = document.getElementById('frame'), term = document.getElementById('term'),
            log = document.getElementById('termLog'), skipBtn = document.getElementById('termSkip');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var lit = false, gen = 0;

        function light() {                 // hand off: drop the terminal, wake the screen
            if (lit) return;
            lit = true; gen++;
            if (skipBtn && document.activeElement === skipBtn) {   // keep the keyboard on the page
                frame.setAttribute('tabindex', '-1');
                try { frame.focus({ preventScroll: true }); } catch (e) { frame.focus(); }
            }
            if (term && term.parentNode) term.parentNode.removeChild(term);
            if (skipBtn && skipBtn.parentNode) skipBtn.parentNode.removeChild(skipBtn);
            frame.className += ' lit';
        }
        if (!frame) return;
        if (reduce || !term || !log || !window.Promise) { light(); return; }

        /* ---- the terminal ---- */
        var cursor = document.createElement('span'); cursor.className = 'tc';
        function jump() { term.scrollTop = 1e9; }
        function isIdle(d) { return !!(d && d.lastChild === cursor && d.firstChild.data === ''); }
        function make(text, cls) {
            var d = document.createElement('div');
            d.className = 'tl' + (cls ? ' ' + cls : '');
            d.appendChild(document.createTextNode(text));
            return d;
        }
        function block(text, cls) {          // a line the cursor does not sit on
            var d = make(text, cls); log.appendChild(d); jump(); return d;
        }
        function line(text, cls) {           // the cursor's line: writes on a waiting empty one, else a new one
            var d = log.lastChild;
            if (!isIdle(d)) { d = make('', ''); log.appendChild(d); }
            d.className = 'tl' + (cls ? ' ' + cls : '');
            d.firstChild.data = text;
            d.appendChild(cursor);
            jump();
            return d;
        }
        /* a frame of output: goes in above the waiting cursor line, so the cursor stays
           at the bottom and the frames stack up over it, oldest at the top */
        function stamp(text) {
            var d = make(text, 'tl-art tl-px'), last = log.lastChild;
            if (isIdle(last)) log.insertBefore(d, last); else { log.appendChild(d); line(''); }
            return d;
        }
        /* ease the scroll to the new bottom, so a stamped frame slides up into view and
           the last one slides out: the flipbook the console's boot does */
        function slide(ms) {
            var g = gen, el = term, start = el.scrollTop, end = el.scrollHeight - el.clientHeight;
            if (ms <= 0 || end <= start) { jump(); return Promise.resolve(); }
            return new Promise(function (res) {
                var t0 = Date.now();
                (function step() {
                    if (g !== gen) return;
                    var t = Math.min(1, (Date.now() - t0) / ms);
                    el.scrollTop = start + (end - start) * (1 - Math.pow(1 - t, 2));   // ease-out
                    if (t < 1) requestAnimationFrame(step); else res();
                })();
            });
        }
        function pause(ms) {
            var g = gen;
            return new Promise(function (res) { setTimeout(function () { if (g === gen) res(); }, ms); });
        }
        /* dotted leader to a fixed width, the way the console's checks line up */
        function lead(left, right) {
            var w = 34, dots = w - left.length - right.length - 2;
            return left + ' ' + new Array(Math.max(3, dots) + 1).join('.') + ' ' + right;
        }
        /* a check: the leader prints now, the result lands when the check is done */
        function check(left, right, ms, cls) {
            var full = lead(left, right), d = line(full.slice(0, full.length - right.length));
            return pause(ms).then(function () { d.firstChild.data = full; if (cls) d.className += ' ' + cls; });
        }
        function pad2(n) { return (n < 10 ? '0' : '') + n; }

        /* ---- the eye: the LCD's own pixel eye, cell for cell. every cell is two
           characters wide and, at line-height .8, one row tall, so the cells come out
           square (VT323 is .4em to the column). the three blink frames and the glance
           are the LCD's too, so the terminal and the screen draw the same eye. generated
           from the SVG's rects; a cell row of padding under each keeps them apart ---- */
        var EYE = {
            open: [
                '                      ##############',
                '                ########################',
                '              ############################',
                '        ########################      ######',
                '        ########  ##############          ####',
                '      ########    ########    ######        ##',
                '    ####          ##############              ##',
                '  ##                ############',
                '##                  ##########        ##########',
                '      ############              ########',
                '              ######################',
                '                    ##########'
            ].join('\n'),
            left: [
                '                      ##############',
                '                ########################',
                '              ############################',
                '        ########################      ######',
                '    ########  ##############              ####',
                '  ########    ########    ######            ##',
                '    ####      ##############                  ##',
                '  ##            ############',
                '##              ##########            ##########',
                '      ############              ########',
                '              ######################',
                '                    ##########'
            ].join('\n'),
            right: [
                '                      ##############',
                '                ########################',
                '              ############################',
                '        ########################      ######',
                '            ########  ##############      ####',
                '          ########    ########    ######    ##',
                '    ####              ##############          ##',
                '  ##                    ############',
                '##                      ##########    ##########',
                '      ############              ########',
                '              ######################',
                '                    ##########'
            ].join('\n'),
            half: [
                '',
                '',
                '',
                '',
                '            ##########################',
                '        ####################################',
                '        ####      ##############      ##########',
                '  ######            ############',
                '##                  ##########        ##########',
                '      ############              ########',
                '              ######################',
                '                    ##########'
            ].join('\n'),
            slit: [
                '',
                '',
                '',
                '',
                '',
                '',
                '        ##########              ################',
                '  ######          ##############',
                '##################  ##########  ################',
                '                  ##############',
                '',
                ''
            ].join('\n'),
            shut: [
                '',
                '',
                '',
                '',
                '',
                '',
                '                                              ##',
                '  ################              ##############',
                '################################################',
                '                  ##############',
                '',
                ''
            ].join('\n')
        };

        var BANNER = [
        ' ___ ____    _        _    ____   _   _ ____  _____',
        '|_ _/ ___|  / \\      / \\  / ___| | | | |  _ \\| ____|',
        ' | |\\___ \\ / _ \\    / _ \\| |     | | | | |_) |  _|',
        ' | | ___) / ___ \\  / ___ \\ |___  | |_| |  _ <| |___',
        '|___|____/_/   \\_\\/_/   \\_\\____|  \\___/|_| \\_\\_____|'
        ].join('\n');

        /* ---- the sequence ---- */
        function run() {
            var g = gen, now = new Date();
            var today = now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
            function eyeFrame(name, slideMs, hold) {
                return function () { if (g !== gen) return; stamp(EYE[name]); return slide(slideMs).then(function () { return pause(hold); }); };
            }
            /* about 3.2s end to end: the checks land in order, quick ones quicker, the
               ones that look for something a beat longer; the eye's one blink keeps the
               LCD's timing */
            var seq = pause(250)
                .then(function () { return check('> power', 'ok', 60); })
                .then(function () { return pause(20); })
                .then(function () { return check('> memcheck 8K', 'ok', 110); })
                .then(function () { return pause(20); })
                .then(function () { return check('> clock', today, 30); })
                .then(function () { return pause(20); })
                .then(function () { return check('> mounting /site', 'not found', 170, 'tl-warn'); })
                .then(function () { return pause(30); })
                .then(function () { line(lead('> looking for isaacure.com', '')); return pause(220); })
                .then(function () { line('  nothing here yet', 'tl-dim'); return pause(100); })
                .then(function () { return check('> eye subsystem', 'waking', 100); })
                .then(function () { return pause(70); })
                .then(function () {
                    block('');
                    block(BANNER, 'tl-art');
                    line('                A GOOD EYE OS  v1.0', 'tl-art tl-dim');
                    return pause(220);
                })
                .then(function () { block(''); line(''); return pause(30); })
                // the eye powers on, has a look around, and blinks once, the LCD's blink
                // (half 45 · slit 40 · shut 90 · slit 55 · half 70): each frame is stamped
                // under the last and the log slides up to it
                .then(eyeFrame('open', 120, 260))
                .then(eyeFrame('left', 40, 70)).then(eyeFrame('right', 40, 70)).then(eyeFrame('open', 40, 80));
            [['half', 45], ['slit', 40], ['shut', 90], ['slit', 55], ['half', 70]].forEach(function (f) { seq = seq.then(eyeFrame(f[0], 20, f[1])); });
            seq = seq.then(eyeFrame('open', 40, 200));
            seq.then(function () { return pause(120); })
               .then(function () { return check('> handing off to /dev/eye0', 'ok', 80); })
               .then(function () { return pause(200); })
               .then(function () { if (g === gen) light(); })
               .catch(light);
        }

        /* any key, a tap or click anywhere, or the button skips to the screen. a browser
           chord (zoom, find, reload) is not a skip, nor are lock and function keys; a click
           rather than pointerdown, so a pinch to read the small type or a swipe is not either */
        window.addEventListener('keydown', function (e) {
            if (lit || e.ctrlKey || e.metaKey || e.altKey) return;
            if (/^(Tab|Shift|Control|Alt|Meta|AltGraph|CapsLock|NumLock|ScrollLock|Dead|Unidentified|Process|ContextMenu|PrintScreen|F\d{1,2})$/.test(e.key)) return;
            light();
        });
        window.addEventListener('click', function () { light(); });   // the skip button's click bubbles here too

        /* the terminal shows its lone cursor at once, then waits (briefly) for its face, so
           the art does not reflow mid-boot, and waits to be looked at: in a hidden tab timers
           crawl and frames cannot slide. the 12s budget is armed when the boot really starts;
           the 20s one from now covers a document that never says it is visible. */
        var started = false;
        term.hidden = false; skipBtn.hidden = false; line('');
        function fit() {                 // the column the face really advances, for the art's size
            var probe = make('0000000000', 'tl-art');
            probe.style.cssText = 'position:absolute;visibility:hidden';
            log.appendChild(probe);
            var em = parseFloat(getComputedStyle(probe).fontSize), w = probe.getBoundingClientRect().width;
            log.removeChild(probe);
            if (w > 0 && em > 0) term.style.setProperty('--col', (w / 10 / em).toFixed(4));
        }
        function start() {
            if (started || lit) return;
            started = true;
            setTimeout(light, 12000);
            fit();
            try { run(); } catch (e) { light(); }
        }
        function whenVisible(fn) {
            if (!document.hidden) return fn();
            document.addEventListener('visibilitychange', function f() {
                if (!document.hidden) { document.removeEventListener('visibilitychange', f); fn(); }
            });
        }
        function go() { whenVisible(start); }
        setTimeout(function () { if (!started) light(); }, 20000);
        if (document.fonts && document.fonts.load) {
            document.fonts.load('1em VT323').then(function () { if (started && !lit) fit(); go(); }, go);
            setTimeout(go, 1500);
        } else go();
    })();
    </script>
</body>
</html>
